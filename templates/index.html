<script>


// =====================================================
// 🎯 ÉTAT DE L'APPLICATION
// =====================================================

let current = null;

let currentMode = "none";

let currentFreeMathType = "addition";

let adaptiveExercises = [];

// =====================================================
// 🧠 DERNIÈRE COMPOSITION GÉNÉRÉE
// =====================================================

let lastGeneratedComposition = [];

let adaptiveIndex = 0;

let adaptiveLevel = 1;

let adaptiveSessionStarted = false;

let adaptiveSessionFinished = false;


// =====================================================
// 🔊 VOIX
// =====================================================

// =====================================================
// 🔊 VOIX DE MAMA BINTA
// =====================================================

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    if (!text) {
        return;
    }

    // 🔇 Ne pas faire prononcer les emojis
    const speechText =
        String(text)
            .replace(
                /[\p{Extended_Pictographic}\uFE0F\u200D]/gu,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    if (!speechText) {
        return;
    }

    // 🛑 Arrêter une éventuelle ancienne phrase
    speechSynthesis.cancel();

    const voices =
        speechSynthesis.getVoices();

    // 🇫🇷 Garder uniquement les voix françaises
    const frenchVoices =
        voices.filter(
            function(voice) {

                return (
                    voice.lang &&
                    voice.lang
                        .toLowerCase()
                        .startsWith("fr")
                );

            }
        );

    // 👩 Chercher en priorité une voix féminine
    const femaleNames = [
        "amelie",
        "amélie",
        "audrey",
        "aurelie",
        "aurélie",
        "marie",
        "virginie",
        "julie",
        "sophie",
        "claire",
        "celine",
        "céline",
        "chloe",
        "chloé",
        "lea",
        "léa",
        "louise",
        "camille",
        "manon",
        "emma",
        "charlotte",
        "margot",
        "fanny",
        "alice",
        "nathalie",
        "helene",
        "hélène",
        "florence",
        "isabelle",
        "justine",
        "pauline",
        "valerie",
        "valérie",
        "caroline",
        "elodie",
        "élodie"
    ];

    let femaleVoice =
        frenchVoices.find(
            function(voice) {

                const name =
                    voice.name
                        .toLowerCase();

                return femaleNames.some(
                    function(firstName) {

                        return name.includes(
                            firstName
                        );

                    }
                );

            }
        );

    // 🇫🇷 Si aucune voix féminine identifiable
    // n'est disponible, utiliser une voix française.
    if (!femaleVoice) {

        femaleVoice =
            frenchVoices[0] || null;

    }

    const u =
        new SpeechSynthesisUtterance(
            speechText
        );

    u.lang = "fr-FR";

    // 👩 Utiliser la voix française sélectionnée
    if (femaleVoice) {

        u.voice =
            femaleVoice;

    }

    // 👧 Voix douce adaptée à l'enfant
    u.rate = 0.85;
    u.pitch = 1.2;

    speechSynthesis.speak(u);
}


// =====================================================
// 🔊 CHARGER LES VOIX DU NAVIGATEUR
// =====================================================

if (
    "speechSynthesis" in window
) {

    speechSynthesis.addEventListener(
        "voiceschanged",
        function() {

            console.log(
                "🔊 Voix disponibles :",
                speechSynthesis
                    .getVoices()
                    .map(
                        function(voice) {
                            return (
                                voice.name +
                                " — " +
                                voice.lang
                            );
                        }
                    )
            );

        }
    );

}


// =====================================================
// 🎯 NIVEAU ACTUEL
// =====================================================

function getCurrentMamaLevel() {

    try {

        if (
            typeof getPedagogicalLevel ===
            "function"
        ) {

            return getPedagogicalLevel();

        }

        if (
            typeof getMathPlan ===
            "function"
        ) {

            const plan =
                getMathPlan();

            return plan.level || 1;

        }

    } catch (error) {

        console.error(
            "Erreur récupération niveau :",
            error
        );

    }

    return 1;
}


// =====================================================
// 🎯 AFFICHER LE NIVEAU
// =====================================================

function updateLevelDisplay() {

    const levelElement =
        document.getElementById(
            "level"
        );

    if (!levelElement) {
        return;
    }

    const level =
        getCurrentMamaLevel();

    levelElement.innerText =
        "🎯 Niveau pédagogique : " +
        level +
        " / 100";
}


// =====================================================
// 📊 AFFICHER LA SESSION
// =====================================================

function updateSessionDisplay() {

    const sessionElement =
        document.getElementById(
            "session"
        );

    if (!sessionElement) {
        return;
    }

    if (
        currentMode !== "adaptive" ||
        !adaptiveSessionStarted
    ) {

        sessionElement.classList.add(
            "hidden"
        );

        return;
    }

    sessionElement.classList.remove(
        "hidden"
    );

    const number =
        Math.min(
            adaptiveIndex + 1,
            5
        );

    sessionElement.innerText =
        "🤖 Session personnalisée : exercice " +
        number +
        " / 5";
}


// =====================================================
// 🧹 CACHER LE MENU MATHS
// =====================================================

function hideMathMenu() {

    const menu =
        document.getElementById(
            "mathMenu"
        );

    if (menu) {

        menu.classList.add(
            "hidden"
        );

    }
}


// =====================================================
// 🧮 MENU MATHS
// =====================================================

function showMathMenu() {

    const menu =
        document.getElementById(
            "mathMenu"
        );

    if (!menu) {
        return;
    }

    menu.classList.toggle(
        "hidden"
    );
}


// =====================================================
// 🛡️ OBTENIR UNE QUESTION VALIDÉE
// =====================================================

function getVerifiedQuestion(generator) {

    try {

        let attempts = 0;

        while (
            attempts < 10
        ) {

            const question =
                generator();

            if (!question) {

                attempts++;

                continue;
            }

            const verification =
                verifyQuestion(
                    question
                );

            if (
                verification &&
                verification.valid
            ) {

                current =
                    question;

                showQuestion();

                updateLevelDisplay();

                return true;
            }

            console.warn(
                "❌ Question refusée :",
                verification
                    ? verification.reason
                    : "Question inconnue"
            );

            attempts++;
        }

        document.getElementById(
            "box"
        ).innerText =
            "⚠️ La maîtresse prépare une nouvelle question.\n\n" +
            "Essaie encore dans un instant. 😊";

        speak(
            "La maîtresse prépare une nouvelle question."
        );

        return false;

    } catch (error) {

        console.error(
            "Erreur entre les agents :",
            error
        );

        document.getElementById(
            "box"
        ).innerText =
            "⚠️ Petit problème technique.\n\n" +
            "La maîtresse prépare une nouvelle question. 😊";

        speak(
            "Petit problème technique. " +
            "La maîtresse prépare une nouvelle question."
        );

        return false;
    }
}


// =====================================================
// 📖 LECTURE LIBRE
// =====================================================

function startReading() {

    currentMode =
        "reading";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    adaptiveIndex = 0;

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateReadingQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// 🧮 ADDITION
// =====================================================

function startMathAddition() {

    currentMode =
        "math";

    currentFreeMathType =
        "addition";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateAdditionQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// ➖ SOUSTRACTION
// =====================================================

function startMathSubtraction() {

    currentMode =
        "math";

    currentFreeMathType =
        "subtraction";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateSubtractionQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// ✖️ MULTIPLICATION
// =====================================================

function startMathMultiplication() {

    currentMode =
        "math";

    currentFreeMathType =
        "multiplication";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateMultiplicationQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// 🤖 DÉMARRER LE PARCOURS PERSONNALISÉ
// =====================================================

function startAdaptive() {

    currentMode =
        "adaptive";

    hideMathMenu();

    adaptiveExercises = [];

    adaptiveIndex = 0;

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    try {

        adaptiveLevel =
            getCurrentMamaLevel();
// -------------------------------------------------
// 📡 0️⃣ DEMANDER LE PLAN AU PLANIFICATEUR
// -------------------------------------------------

if (
    typeof getLearningPlan ===
    "function"
) {

    const learningPlan =
        getLearningPlan();

    console.log(
        "📡 Session personnalisée : plan demandé au Planificateur.",
        learningPlan
    );

}


        // -------------------------------------------------
        // 1️⃣ DÉMARRER UNE SESSION
        // -------------------------------------------------

        if (
            typeof startLearningSession !==
            "function"
        ) {

            throw new Error(
                "startLearningSession() est indisponible."
            );

        }


        const session =
            startLearningSession(
                adaptiveLevel
            );


        if (!session) {

            throw new Error(
                "Impossible de démarrer la session."
            );

        }


        adaptiveSessionStarted =
            true;


        // -------------------------------------------------
        // 2️⃣ GÉNÉRER LES 5 EXERCICES
        // -------------------------------------------------

        if (
            typeof generateLearningSession !==
            "function"
        ) {

            throw new Error(
                "generateLearningSession() est indisponible."
            );

        }


        const generated =
            generateLearningSession(
                adaptiveLevel
            );


        if (
            !Array.isArray(generated)
        ) {

            throw new Error(
                "Le générateur n'a pas retourné une liste."
            );

        }


        if (
            generated.length !== 5
        ) {

            throw new Error(
                "La session contient " +
                generated.length +
                " exercices au lieu de 5."
            );

        }


         // -------------------------------------------------
         // 3️⃣ RÉCUPÉRER LES EXERCICES DÉJÀ VÉRIFIÉS
         // -------------------------------------------------

         const verifiedExercises = generated;


        // -------------------------------------------------
        // 4️⃣ INSTALLER LA SESSION
        // -------------------------------------------------

        adaptiveExercises =
            verifiedExercises;
       lastGeneratedComposition = verifiedExercises.map(
          function(question) {
             return question.skill || "inconnue";
          }
      );

    // -------------------------------------------------
    // 💾 SAUVEGARDER LA COMPOSITION RÉELLE
    // -------------------------------------------------

try {

    localStorage.setItem(
        "mamaBintaLastGeneratedComposition",
        JSON.stringify(
            lastGeneratedComposition
        )
    );

} catch (error) {

    console.warn(
        "⚠️ Impossible de sauvegarder la composition réelle.",
        error
    );

}

adaptiveIndex = 0;
       
        updateSessionDisplay();

        showAdaptiveExercise();


    } catch (error) {

        console.error(
            "❌ Erreur démarrage session :",
            error
        );


        adaptiveExercises = [];

        adaptiveIndex = 0;

        adaptiveSessionStarted =
            false;


        document.getElementById(
            "box"
        ).innerText =

            "⚠️ La maîtresse n'arrive pas à préparer la session.\n\n" +
            "Erreur détectée : " +
            error.message +
            "\n\n" +
            "Essaie encore dans un instant. 😊";


        speak(
            "La maîtresse n'arrive pas à préparer la session. " +
            "Essaie encore dans un instant."
        );


        updateSessionDisplay();
    }
}


// =====================================================
// 🤖 AFFICHER EXERCICE PERSONNALISÉ
// =====================================================

function showAdaptiveExercise() {

    if (
        adaptiveIndex >=
        adaptiveExercises.length
    ) {

        finishAdaptiveSession();

        return;
    }

    current =
        adaptiveExercises[
            adaptiveIndex
        ];

    updateSessionDisplay();

    showQuestion();
}


// =====================================================
// 📝 AFFICHER QUESTION
// =====================================================

function showQuestion() {

    if (!current) {
        return;
    }

    const box =
        document.getElementById(
            "box"
        );

    box.innerHTML = "";


    const questionElement =
        document.createElement(
            "div"
        );

    questionElement.style.marginBottom =
        "15px";

    questionElement.innerText =
        current.question;

    box.appendChild(
        questionElement
    );


    if (
        !Array.isArray(
            current.choices
        )
    ) {

        box.innerText =
            "⚠️ Cette question n'a pas de réponses disponibles.";

        return;
    }


    current.choices.forEach(
        function(choice) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "choice";

            button.innerText =
                choice;

            button.addEventListener(
                "click",
                function() {

                    checkAnswer(
                        choice
                    );

                }
            );

            box.appendChild(
                button
            );

            box.appendChild(
                document.createElement(
                    "br"
                )
            );

        }
    );


    speak(
        current.question
    );
}


// =====================================================
// ✅ ENREGISTRER UNE RÉPONSE
// =====================================================

function checkAnswer(choice) {

    if (!current) {
        return;
    }


    const buttons =
        document.querySelectorAll(
            ".choice"
        );


    buttons.forEach(
        function(button) {

            button.disabled =
                true;

        }
    );


   


    // -------------------------------------------------
    // 🤖 MÉMOIRE DE SESSION
    // -------------------------------------------------

    if (
        currentMode === "adaptive" &&
        typeof recordSessionExercise ===
        "function"
    ) {

        recordSessionExercise(
            current,
            choice
        );

    }


// -------------------------------------------------
// 📡 RÉPONSE DE L'ENFANT → BUS → PROFESSEUR
// -------------------------------------------------

let result = {
    message:
        choice === current.answer
            ? "🎉 Bravo !"
            : "💪🏾 Continue tes efforts !\n\n❌ Nouvelle erreur mémorisée",

    speech:
        choice === current.answer
            ? "Bravo !"
            : "Continue tes efforts !"
};


if (
    typeof agentSendMessage ===
    "function"
) {

    const teacherRequestId =
        "teacher_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2);


    agentSendMessage(
        "orchestrator",
        "teacher",
        "student_answer",
        {
            requestId:
                teacherRequestId,

            question:
                current,

            studentAnswer:
                choice,

            correctAnswer:
                current.answer,

            isCorrect:
                choice ===
                current.answer,

            skill:
                current.skill ||
                null
        },

        "La réponse de Mama Binta est envoyée au Professeur.",

        "human"
    );


    console.log(
        "📡 Application → Bus → Professeur : réponse envoyée.",
        {
            requestId:
                teacherRequestId,

            question:
                current,

            studentAnswer:
                choice
        }
    );

} else {

    console.warn(
        "⚠️ Agent Bus indisponible : réponse non envoyée au Professeur."
    );
}

    // -------------------------------------------------
    // 💬 AFFICHAGE
    // -------------------------------------------------

    document.getElementById(
        "box"
    ).innerText =
        result.message;


    // -------------------------------------------------
    // 🔊 VOIX
    // -------------------------------------------------

    speak(
        result.speech
    );


    // -------------------------------------------------
    // 🤖 SESSION PERSONNALISÉE
    // -------------------------------------------------

    if (
        currentMode === "adaptive"
    ) {

        setTimeout(
            function() {

                adaptiveIndex++;

                if (
                    adaptiveIndex <
                    adaptiveExercises.length
                ) {

                    showAdaptiveExercise();

                } else {

                    finishAdaptiveSession();

                }

            },
            1800
        );

        return;
    }


    // -------------------------------------------------
    // 🎯 ENTRAÎNEMENT LIBRE
    // -------------------------------------------------

    updateLevelDisplay();
}


// =====================================================
// 🏆 FIN DE SESSION PERSONNALISÉE
// =====================================================

function finishAdaptiveSession() {

    if (
        adaptiveSessionFinished
    ) {

        return;
    }


    adaptiveSessionFinished =
        true;


    let session = null;


    if (
        typeof getCurrentLearningSession ===
        "function"
    ) {

        session =
            getCurrentLearningSession();

    }


    if (!session) {

        document.getElementById(
            "box"
        ).innerText =

            "⚠️ Impossible de récupérer le résultat " +
            "de la session.";

        return;
    }


    const score =
        Number(
            session.score ||
            session.correct ||
            0
        );


    const stars =
        getSessionStarsSafe(
            score
        );


    // -------------------------------------------------
    // 🎯 DÉCISION DU PLANIFICATEUR
    // -------------------------------------------------

    let decisionObject = null;


    if (
        typeof getSessionDecision ===
        "function"
    ) {

        decisionObject =
            getSessionDecision(
                score
            );

    }


    if (
        !decisionObject
    ) {

        decisionObject = {

            action:
                score >= 4
                    ? "progresser"
                    : score === 3
                        ? "consolider"
                        : "renforcer",

            status:
                score >= 4
                    ? "réussite"
                    : score === 3
                        ? "consolidation"
                        : "renforcement",

            stars:
                stars

        };

    }


    const action =
        decisionObject.action;
     
// -------------------------------------------------
// 🔎 ANALYSEUR : ANALYSER LA SESSION TERMINÉE
// -------------------------------------------------

if (
    typeof analyzeStudent ===
    "function" &&
    typeof publishAnalyzerResultToPlanner ===
    "function"
) {

    try {

        const analysis =
            analyzeStudent();

        publishAnalyzerResultToPlanner(
            analysis
        );

    "━━━━━━━━━━━━━━━━━━\n\n" +

    "📊 BUS DES AGENTS\n\n" +

    "🔎 Analyseur → 🎯 Planificateur     " +
    (analyzerPlanner.length > 0 ? "✅ " : "⚠️ ") +
    analyzerPlanner.length +

    "\n" +

    "🎯 Planificateur → 📚 Générateur   " +
    (plannerGenerator.length > 0 ? "✅ " : "⚠️ ") +
    plannerGenerator.length +

    "\n" +

    "📚 Générateur → 🎯 Planificateur   " +
    (generatorPlanner.length > 0 ? "✅ " : "⚠️ ") +
    generatorPlanner.length +

    "\n" +

    "📚 Générateur → 🛡️ Vérificateur    " +
    (generatorVerifier.length > 0 ? "✅ " : "⚠️ ") +
    generatorVerifier.length +

    "\n" +

    "🛡️ Vérificateur → 📚 Générateur    " +
    (verifierGenerator.length > 0 ? "✅ " : "⚠️ ") +
    verifierGenerator.length +

    "\n" +

    "🛡️ Vérificateur → 👩🏾‍🏫 Professeur " +
    (verifierTeacher.length > 0 ? "✅ " : "⚠️ ") +
    verifierTeacher.length +

    "\n" +

    "🤖 Orchestrateur → 👩🏾‍🏫 Professeur  " +
    (orchestratorTeacher.length > 0 ? "✅ " : "⚠️ ") +
    orchestratorTeacher.length +

    "\n" +

    "👩🏾‍🏫 Professeur → 🤖 Orchestrateur  " +
    (teacherOrchestrator.length > 0 ? "✅ " : "⚠️ ") +
    teacherOrchestrator.length +

    "\n\n";


if (
    plannerGenerator.length > 0
) {

    busSummary +=
        "🤖 Planificateur → Générateur\n" +
        "✅ Liaison confirmée par le Bus.";

} else {

    busSummary +=
        "🤖 Planificateur → Générateur\n" +
        "⚠️ Liaison non détectée.";

}


// =================================================
// 📌 RÉSUMÉ EN HAUT DU DIAGNOSTIC
// =================================================

message =
    "🧪 DIAGNOSTIC DU BUS DES AGENTS\n\n" +

    busSummary +

    "\n\n━━━━━━━━━━━━━━━━━━\n\n" +

    message.replace(
        "🧪 DIAGNOSTIC DU BUS DES AGENTS\n\n",
        ""
    );


// =================================================
// 🖥️ AFFICHER
// =================================================

// -------------------------------------------------
// 🖥️ AFFICHER LE DIAGNOSTIC
// -------------------------------------------------

document.getElementById(
    "box"
).innerText =
    message;


// -------------------------------------------------
// 👁️ OPTION AFFICHER / MASQUER LES DÉTAILS
// -------------------------------------------------

const diagnosticToggle =
    document.createElement("button");

diagnosticToggle.innerText =
    "👁️ Masquer les détails";

diagnosticToggle.style.marginTop =
    "10px";

diagnosticToggle.style.width =
    "100%";

diagnosticToggle.style.padding =
    "12px";

diagnosticToggle.style.borderRadius =
    "10px";

diagnosticToggle.style.border =
    "none";

diagnosticToggle.style.cursor =
    "pointer";

let diagnosticDetailsVisible =
    true;

diagnosticToggle.onclick =
    function () {

        diagnosticDetailsVisible =
            !diagnosticDetailsVisible;

        if (
            diagnosticDetailsVisible
        ) {

            document.getElementById(
                "box"
            ).innerText =
                message;

            diagnosticToggle.innerText =
                "👁️ Masquer les détails";

        }

        else {

            document.getElementById(
                "box"
            ).innerText =
                "🧪 DIAGNOSTIC DU BUS DES AGENTS\n\n" +
                "ℹ️ Les informations détaillées " +
                "des agents sont masquées.";

            diagnosticToggle.innerText =
                "👁️ Afficher les détails";

        }

    };

document.getElementById(
    "box"
).prepend(
    diagnosticToggle
);

// -------------------------------------------------
// 🔎 RECHERCHER PAR AGENT
// -------------------------------------------------

const diagnosticSearch =
    document.createElement("select");

diagnosticSearch.style.marginTop =
    "10px";

diagnosticSearch.style.width =
    "100%";

diagnosticSearch.style.padding =
    "12px";

diagnosticSearch.style.borderRadius =
    "10px";

diagnosticSearch.style.border =
    "1px solid #ccc";

diagnosticSearch.innerHTML =
    `
    <option value="all">
        🔎 Tous les agents
    </option>

    <option value="analyzer">
        🔎 Analyseur
    </option>

    <option value="planner">
        🎯 Planificateur
    </option>

    <option value="generator">
        📚 Générateur
    </option>

    <option value="verifier">
        🛡️ Vérificateur
    </option>

    <option value="teacher">
        👩🏾‍🏫 Professeur
    </option>

    <option value="orchestrator">
        🤖 Orchestrateur
    </option>

    <option value="memory">
        🧠 Mémoire
    </option>

    <option value="profile">
        🧑🏾‍🏫 Profil
    </option>
    `;

diagnosticSearch.onchange =
    function () {

        const selectedAgent =
            diagnosticSearch.value;

        if (
            selectedAgent === "all"
        ) {

            document.getElementById(
                "box"
            ).innerText =
                message;

            return;
        }

        const filteredMessages =
            allMessages.filter(
                function(agentMessage) {

                    return (
                        agentMessage.from ===
                            selectedAgent ||

                        agentMessage.to ===
                            selectedAgent
                    );

                }
            );

        let filteredMessage =
            "🔎 RECHERCHE DANS LE BUS\n\n";

        filteredMessage +=
            "Agent recherché : " +
            selectedAgent +
            "\n\n";

        filteredMessage +=
            "Messages trouvés : " +
            filteredMessages.length +
            "\n\n";

        if (
            filteredMessages.length === 0
        ) {

            filteredMessage +=
                "⚠️ Aucun message trouvé.";

        } else {

            filteredMessages.forEach(
                function(
                    agentMessage,
                    index
                ) {

                    filteredMessage +=
                        "📨 Message " +
                        (index + 1) +
                        "\n\n" +

                        "De : " +
                        agentMessage.from +
                        "\n" +

                        "Vers : " +
                        agentMessage.to +
                        "\n" +

                        "Type : " +
                        agentMessage.type +
                        "\n" +

                        "Date : " +
                        agentMessage.timestamp +
                        "\n\n" +

                        "Message : " +
                        (
                            agentMessage.message ||
                            "—"
                        ) +

                        "\n\n" +

                        "━━━━━━━━━━━━━━━━━━\n\n";

                }
            );

        }

        document.getElementById(
            "box"
        ).innerText =
            filteredMessage;

    };

document.getElementById(
    "box"
).prepend(
    diagnosticSearch
);
     
// -------------------------------------------------
// 📋 COPIER LES INFORMATIONS DU DIAGNOSTIC
// -------------------------------------------------

const diagnosticCopy =
    document.createElement("button");

diagnosticCopy.innerText =
    "📋 Copier les informations";

diagnosticCopy.style.marginTop =
    "10px";

diagnosticCopy.style.width =
    "100%";

diagnosticCopy.style.padding =
    "12px";

diagnosticCopy.style.borderRadius =
    "10px";

diagnosticCopy.style.border =
    "none";

diagnosticCopy.style.cursor =
    "pointer";

diagnosticCopy.onclick =
    async function () {

        try {

            await navigator.clipboard.writeText(
                message
            );

            diagnosticCopy.innerText =
                "✅ Informations copiées !";

            setTimeout(
                function () {

                    diagnosticCopy.innerText =
                        "📋 Copier les informations";

                },
                2000
            );

        } catch (error) {

            console.error(
                "❌ Impossible de copier le diagnostic :",
                error
            );

            diagnosticCopy.innerText =
                "⚠️ Copie impossible";

        }

    };

document.getElementById(
    "box"
).prepend(
    diagnosticCopy
);

// 🔇 Le diagnostic des agents reste silencieux.
// Il est destiné à la vérification technique.

updateLevelDisplay();

}
     
// =====================================================
// 🔄 RECOMMENCER À ZÉRO
// =====================================================

function resetMamaBinta() {

    const confirmed =
        window.confirm(
            "Voulez-vous vraiment recommencer la progression de Mama Binta à zéro ?"
        );


    if (!confirmed) {
        return;
    }


    try {

        if (
            typeof resetStudentMemory ===
            "function"
        ) {

            resetStudentMemory();
        }


        if (
            typeof resetLearningPlan ===
            "function"
        ) {

            resetLearningPlan();

        } else if (
            typeof resetMathPlan ===
            "function"
        ) {

            resetMathPlan();

        }

    } catch (error) {

        console.error(
            "Erreur lors de la réinitialisation :",
            error
        );

    }


    current = null;

    adaptiveExercises = [];

    adaptiveIndex = 0;

    adaptiveLevel = 1;

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    currentMode =
        "none";


    hideMathMenu();

    updateSessionDisplay();

    updateLevelDisplay();


    document.getElementById(
        "box"
    ).innerText =

        "🔄 La progression de Mama Binta " +
        "a été remise à zéro.\n\n" +

        "Nous recommençons au niveau 1. 🌱";


    speak(
        "La progression de Mama Binta a été remise à zéro. " +
        "Nous recommençons au niveau un."
    );
}


// =====================================================
// 🚀 INITIALISATION
// =====================================================

updateLevelDisplay();

updateSessionDisplay();


console.log(
    "🏫 Interface de Mama Binta chargée."
);

console.log(
    "🎯 Niveau actuel :",
    getCurrentMamaLevel()
);

console.log(
    "🤖 Parcours personnalisé : 5 exercices par session"
);

console.log(
    "📈 Progression pédagogique : niveaux 1 → 100"
);

console.log(
    "📡 Bus de communication des agents : chargé"
);

</script>
