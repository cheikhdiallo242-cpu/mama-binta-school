<script>


// =====================================================
// 🎯 ÉTAT DE L'APPLICATION
// =====================================================

let current = null;

let currentMode = "none";

let currentFreeMathType = "addition";

let adaptiveExercises = [];

let adaptiveIndex = 0;

let adaptiveLevel = 1;

let adaptiveSessionStarted = false;

let adaptiveSessionFinished = false;


// =====================================================
// 🔊 VOIX
// =====================================================

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    if (!text) {
        return;
    }

    speechSynthesis.cancel();

    const u =
        new SpeechSynthesisUtterance(
            text
        );

    u.lang = "fr-FR";
    u.rate = 0.85;
    u.pitch = 1.2;

    speechSynthesis.speak(u);
}


// =====================================================
// 🎯 NIVEAU ACTUEL
// =====================================================

function getCurrentMamaLevel() {

    try {

        if (
            typeof getPedagogicalLevel ===
            "function"
        ) {

            return getPedagogicalLevel();

        }

        if (
            typeof getMathPlan ===
            "function"
        ) {

            const plan =
                getMathPlan();

            return plan.level || 1;

        }

    } catch (error) {

        console.error(
            "Erreur récupération niveau :",
            error
        );

    }

    return 1;
}


// =====================================================
// 🎯 AFFICHER LE NIVEAU
// =====================================================

function updateLevelDisplay() {

    const levelElement =
        document.getElementById(
            "level"
        );

    if (!levelElement) {
        return;
    }

    const level =
        getCurrentMamaLevel();

    levelElement.innerText =
        "🎯 Niveau pédagogique : " +
        level +
        " / 100";
}


// =====================================================
// 📊 AFFICHER LA SESSION
// =====================================================

function updateSessionDisplay() {

    const sessionElement =
        document.getElementById(
            "session"
        );

    if (!sessionElement) {
        return;
    }

    if (
        currentMode !== "adaptive" ||
        !adaptiveSessionStarted
    ) {

        sessionElement.classList.add(
            "hidden"
        );

        return;
    }

    sessionElement.classList.remove(
        "hidden"
    );

    const number =
        Math.min(
            adaptiveIndex + 1,
            5
        );

    sessionElement.innerText =
        "🤖 Session personnalisée : exercice " +
        number +
        " / 5";
}


// =====================================================
// 🧹 CACHER LE MENU MATHS
// =====================================================

function hideMathMenu() {

    const menu =
        document.getElementById(
            "mathMenu"
        );

    if (menu) {

        menu.classList.add(
            "hidden"
        );

    }
}


// =====================================================
// 🧮 MENU MATHS
// =====================================================

function showMathMenu() {

    const menu =
        document.getElementById(
            "mathMenu"
        );

    if (!menu) {
        return;
    }

    menu.classList.toggle(
        "hidden"
    );
}


// =====================================================
// 🛡️ OBTENIR UNE QUESTION VALIDÉE
// =====================================================

function getVerifiedQuestion(generator) {

    try {

        let attempts = 0;

        while (
            attempts < 10
        ) {

            const question =
                generator();

            if (!question) {

                attempts++;

                continue;
            }

            const verification =
                verifyQuestion(
                    question
                );

            if (
                verification &&
                verification.valid
            ) {

                current =
                    question;

                showQuestion();

                updateLevelDisplay();

                return true;
            }

            console.warn(
                "❌ Question refusée :",
                verification
                    ? verification.reason
                    : "Question inconnue"
            );

            attempts++;
        }

        document.getElementById(
            "box"
        ).innerText =
            "⚠️ La maîtresse prépare une nouvelle question.\n\n" +
            "Essaie encore dans un instant. 😊";

        speak(
            "La maîtresse prépare une nouvelle question."
        );

        return false;

    } catch (error) {

        console.error(
            "Erreur entre les agents :",
            error
        );

        document.getElementById(
            "box"
        ).innerText =
            "⚠️ Petit problème technique.\n\n" +
            "La maîtresse prépare une nouvelle question. 😊";

        speak(
            "Petit problème technique. " +
            "La maîtresse prépare une nouvelle question."
        );

        return false;
    }
}


// =====================================================
// 📖 LECTURE LIBRE
// =====================================================

function startReading() {

    currentMode =
        "reading";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    adaptiveIndex = 0;

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateReadingQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// 🧮 ADDITION
// =====================================================

function startMathAddition() {

    currentMode =
        "math";

    currentFreeMathType =
        "addition";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateAdditionQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// ➖ SOUSTRACTION
// =====================================================

function startMathSubtraction() {

    currentMode =
        "math";

    currentFreeMathType =
        "subtraction";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateSubtractionQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// ✖️ MULTIPLICATION
// =====================================================

function startMathMultiplication() {

    currentMode =
        "math";

    currentFreeMathType =
        "multiplication";

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    hideMathMenu();

    adaptiveExercises = [];

    updateSessionDisplay();

    getVerifiedQuestion(
        function() {

            return generateMultiplicationQuestion(
                getCurrentMamaLevel()
            );

        }
    );
}


// =====================================================
// 🤖 DÉMARRER LE PARCOURS PERSONNALISÉ
// =====================================================

function startAdaptive() {

    currentMode =
        "adaptive";

    hideMathMenu();

    adaptiveExercises = [];

    adaptiveIndex = 0;

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    try {

        adaptiveLevel =
            getCurrentMamaLevel();


        // -------------------------------------------------
        // 1️⃣ DÉMARRER UNE SESSION
        // -------------------------------------------------

        if (
            typeof startLearningSession !==
            "function"
        ) {

            throw new Error(
                "startLearningSession() est indisponible."
            );

        }


        const session =
            startLearningSession(
                adaptiveLevel
            );


        if (!session) {

            throw new Error(
                "Impossible de démarrer la session."
            );

        }


        adaptiveSessionStarted =
            true;


        // -------------------------------------------------
        // 2️⃣ GÉNÉRER LES 5 EXERCICES
        // -------------------------------------------------

        if (
            typeof generateLearningSession !==
            "function"
        ) {

            throw new Error(
                "generateLearningSession() est indisponible."
            );

        }


        const generated =
            generateLearningSession(
                adaptiveLevel
            );


        if (
            !Array.isArray(generated)
        ) {

            throw new Error(
                "Le générateur n'a pas retourné une liste."
            );

        }


        if (
            generated.length !== 5
        ) {

            throw new Error(
                "La session contient " +
                generated.length +
                " exercices au lieu de 5."
            );

        }


        // -------------------------------------------------
        // 3️⃣ VÉRIFIER LES 5 EXERCICES
        // -------------------------------------------------

        const verifiedExercises = [];


        for (
            let i = 0;
            i < generated.length;
            i++
        ) {

            const question =
                generated[i];


            if (!question) {

                throw new Error(
                    "L'exercice " +
                    (i + 1) +
                    " est vide."
                );

            }


            const verification =
                verifyQuestion(
                    question
                );


            if (
                !verification ||
                !verification.valid
            ) {

                throw new Error(
                    "Exercice " +
                    (i + 1) +
                    " invalide : " +
                    (
                        verification
                            ? verification.reason
                            : "raison inconnue"
                    )
                );

            }


            verifiedExercises.push(
                question
            );
        }


        // -------------------------------------------------
        // 4️⃣ INSTALLER LA SESSION
        // -------------------------------------------------

        adaptiveExercises =
            verifiedExercises;

        adaptiveIndex = 0;

        updateSessionDisplay();

        showAdaptiveExercise();


    } catch (error) {

        console.error(
            "❌ Erreur démarrage session :",
            error
        );


        adaptiveExercises = [];

        adaptiveIndex = 0;

        adaptiveSessionStarted =
            false;


        document.getElementById(
            "box"
        ).innerText =

            "⚠️ La maîtresse n'arrive pas à préparer la session.\n\n" +
            "Erreur détectée : " +
            error.message +
            "\n\n" +
            "Essaie encore dans un instant. 😊";


        speak(
            "La maîtresse n'arrive pas à préparer la session. " +
            "Essaie encore dans un instant."
        );


        updateSessionDisplay();
    }
}


// =====================================================
// 🤖 AFFICHER EXERCICE PERSONNALISÉ
// =====================================================

function showAdaptiveExercise() {

    if (
        adaptiveIndex >=
        adaptiveExercises.length
    ) {

        finishAdaptiveSession();

        return;
    }

    current =
        adaptiveExercises[
            adaptiveIndex
        ];

    updateSessionDisplay();

    showQuestion();
}


// =====================================================
// 📝 AFFICHER QUESTION
// =====================================================

function showQuestion() {

    if (!current) {
        return;
    }

    const box =
        document.getElementById(
            "box"
        );

    box.innerHTML = "";


    const questionElement =
        document.createElement(
            "div"
        );

    questionElement.style.marginBottom =
        "15px";

    questionElement.innerText =
        current.question;

    box.appendChild(
        questionElement
    );


    if (
        !Array.isArray(
            current.choices
        )
    ) {

        box.innerText =
            "⚠️ Cette question n'a pas de réponses disponibles.";

        return;
    }


    current.choices.forEach(
        function(choice) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "choice";

            button.innerText =
                choice;

            button.addEventListener(
                "click",
                function() {

                    checkAnswer(
                        choice
                    );

                }
            );

            box.appendChild(
                button
            );

            box.appendChild(
                document.createElement(
                    "br"
                )
            );

        }
    );


    speak(
        current.question
    );
}


// =====================================================
// ✅ ENREGISTRER UNE RÉPONSE
// =====================================================

function checkAnswer(choice) {

    if (!current) {
        return;
    }


    const buttons =
        document.querySelectorAll(
            ".choice"
        );


    buttons.forEach(
        function(button) {

            button.disabled =
                true;

        }
    );


    // -------------------------------------------------
    // 🧠 MÉMOIRE GÉNÉRALE
    // -------------------------------------------------

    if (
        typeof rememberAnswer ===
        "function"
    ) {

        rememberAnswer(
            current,
            choice
        );

    }


    // -------------------------------------------------
    // 🤖 MÉMOIRE DE SESSION
    // -------------------------------------------------

    if (
        currentMode === "adaptive" &&
        typeof recordSessionExercise ===
        "function"
    ) {

        recordSessionExercise(
            current,
            choice
        );

    }


    // -------------------------------------------------
    // 👩🏾‍🏫 PROFESSEUR
    // -------------------------------------------------

    let result = {

        message:
            choice === current.answer
                ? "🎉 Bravo !"
                : "💪🏾 Continue tes efforts !",

        speech:
            choice === current.answer
                ? "Bravo !"
                : "Continue tes efforts !"

    };


    if (
        typeof teacherExplain ===
        "function"
    ) {

        try {

            const teacherResult =
                teacherExplain(
                    current,
                    choice
                );

            if (teacherResult) {

                result =
                    teacherResult;

            }

        } catch (error) {

            console.warn(
                "⚠️ Erreur professeur :",
                error
            );

        }
    }


    // -------------------------------------------------
    // 💬 AFFICHAGE
    // -------------------------------------------------

    document.getElementById(
        "box"
    ).innerText =
        result.message;


    // -------------------------------------------------
    // 🔊 VOIX
    // -------------------------------------------------

    speak(
        result.speech
    );


    // -------------------------------------------------
    // 🤖 SESSION PERSONNALISÉE
    // -------------------------------------------------

    if (
        currentMode === "adaptive"
    ) {

        setTimeout(
            function() {

                adaptiveIndex++;

                if (
                    adaptiveIndex <
                    adaptiveExercises.length
                ) {

                    showAdaptiveExercise();

                } else {

                    finishAdaptiveSession();

                }

            },
            1800
        );

        return;
    }


    // -------------------------------------------------
    // 🎯 ENTRAÎNEMENT LIBRE
    // -------------------------------------------------

    updateLevelDisplay();
}


// =====================================================
// 🏆 FIN DE SESSION PERSONNALISÉE
// =====================================================

function finishAdaptiveSession() {

    if (
        adaptiveSessionFinished
    ) {

        return;
    }


    adaptiveSessionFinished =
        true;


    let session = null;


    if (
        typeof getCurrentLearningSession ===
        "function"
    ) {

        session =
            getCurrentLearningSession();

    }


    if (!session) {

        document.getElementById(
            "box"
        ).innerText =

            "⚠️ Impossible de récupérer le résultat " +
            "de la session.";

        return;
    }


    const score =
        Number(
            session.score ||
            session.correct ||
            0
        );


    const stars =
        getSessionStarsSafe(
            score
        );


    // -------------------------------------------------
    // 🎯 DÉCISION DU PLANIFICATEUR
    // -------------------------------------------------

    let decisionObject = null;


    if (
        typeof getSessionDecision ===
        "function"
    ) {

        decisionObject =
            getSessionDecision(
                score
            );

    }


    if (
        !decisionObject
    ) {

        decisionObject = {

            action:
                score >= 4
                    ? "progresser"
                    : score === 3
                        ? "consolider"
                        : "renforcer",

            status:
                score >= 4
                    ? "réussite"
                    : score === 3
                        ? "consolidation"
                        : "renforcement",

            stars:
                stars

        };

    }


    const action =
        decisionObject.action;


    // -------------------------------------------------
    // 🧠 ENREGISTRER LA SESSION DANS LE PLANIFICATEUR
    // -------------------------------------------------

    if (
        typeof savePlannerSessionResult ===
        "function"
    ) {

        try {

            const skillResults =
                Array.isArray(
                    session.results
                )
                    ? session.results
                    : [];


            savePlannerSessionResult(

                adaptiveLevel,

                score,

                decisionObject,

                skillResults

            );

        } catch (error) {

            console.error(
                "❌ Erreur historique planificateur :",
                error
            );

        }

    }


    // -------------------------------------------------
    // 🎯 LAISSER LE PLANIFICATEUR PRENDRE
    // SA DÉCISION OFFICIELLE
    // -------------------------------------------------

    let plan = null;


    if (
        typeof planLearningLevel ===
        "function"
    ) {

        try {

            plan =
                planLearningLevel();

        } catch (error) {

            console.error(
                "❌ Erreur décision pédagogique :",
                error
            );

        }

    }


    // -------------------------------------------------
    // 🏆 DÉCISION FINALE À AFFICHER
    // -------------------------------------------------

    let decisionText = "";


    if (
        plan &&
        plan.status ===
        "progression"
    ) {

        decisionText =
            "🌟 Bravo ! Nous passons maintenant au niveau " +
            plan.level +
            " !";

    } else if (
        plan &&
        plan.status ===
        "regression"
    ) {

        decisionText =
            "🧠 Nous revenons temporairement au niveau " +
            plan.level +
            " pour renforcer les bases.";

    } else if (
        action === "consolider"
    ) {

        decisionText =
            "📚 Nous allons encore travailler ce niveau.";

    } else {

        decisionText =
            "💪🏾 Nous allons renforcer les notions difficiles.";
    }


    // -------------------------------------------------
    // 👩🏾‍🏫 MESSAGE FINAL
    // -------------------------------------------------

    const displayedLevel =
        adaptiveLevel;


    let message =

        "🏆 SESSION TERMINÉE\n\n" +

        "🎯 Niveau travaillé : " +
        displayedLevel +
        " / 100\n\n" +

        "⭐ Score : " +
        score +
        " / 5\n\n" +

        stars +
        "\n\n" +

        decisionText +
        "\n\n" +

        "👩🏾‍🏫 La maîtresse :\n" +

        getSessionTeacherMessage(
            score
        );


    document.getElementById(
        "box"
    ).innerText =
        message;


    speak(
        getSessionSpeech(
            score
        )
    );


    adaptiveExercises = [];

    adaptiveIndex = 0;

    current = null;

    adaptiveSessionStarted =
        false;


    updateSessionDisplay();

    updateLevelDisplay();
}


// =====================================================
// ⭐ ÉTOILES
// =====================================================

function getSessionStarsSafe(score) {

    if (
        typeof getSessionStars ===
        "function"
    ) {

        return getSessionStars(
            score
        );
    }

    if (score >= 5) return "⭐⭐⭐⭐⭐";
    if (score >= 4) return "⭐⭐⭐⭐";
    if (score >= 3) return "⭐⭐⭐";
    if (score >= 2) return "⭐⭐";
    if (score >= 1) return "⭐";

    return "Aucune étoile";
}


// =====================================================
// 👩🏾‍🏫 MESSAGE FINAL
// =====================================================

function getSessionTeacherMessage(score) {

    if (score === 5) {

        return (
            "Excellent Mama Binta ! " +
            "Tu as réussi les 5 exercices. " +
            "Quel beau travail ! 🌟"
        );

    }

    if (score === 4) {

        return (
            "Très beau travail ! " +
            "Tu as réussi 4 exercices sur 5. " +
            "Continue comme ça ! 💪🏾"
        );

    }

    if (score === 3) {

        return (
            "Bravo pour tes efforts. " +
            "Nous allons encore nous entraîner " +
            "sur certaines notions. 📚"
        );

    }

    if (score === 2) {

        return (
            "Ne te décourage pas. " +
            "Les erreurs nous montrent ce qu'il faut " +
            "encore apprendre. 💪🏾"
        );

    }

    return (
        "Ce n'est pas grave Mama Binta. " +
        "Nous allons reprendre tranquillement " +
        "les notions difficiles. ❤️"
    );
}


// =====================================================
// 🔊 MESSAGE VOCAL FINAL
// =====================================================

function getSessionSpeech(score) {

    if (score === 5) {

        return (
            "Excellent Mama Binta ! " +
            "Tu as réussi les cinq exercices. " +
            "Quel beau travail !"
        );

    }

    if (score === 4) {

        return (
            "Très beau travail ! " +
            "Tu as réussi quatre exercices sur cinq. " +
            "Continue comme ça !"
        );

    }

    if (score === 3) {

        return (
            "Bravo pour tes efforts. " +
            "Nous allons encore nous entraîner " +
            "sur certaines notions."
        );

    }

    return (
        "Ne te décourage pas. " +
        "Nous allons reprendre tranquillement " +
        "les notions difficiles."
    );
}


// =====================================================
// 🧠 PROGRESSION
// =====================================================

function showProgress() {

    hideMathMenu();

    const report =
        getMemoryReport();


    let message =

        "🧠 PROGRESSION DE MAMA BINTA\n\n" +

        report.general +
        "\n\n" +

        report.reading +
        "\n\n" +

        report.maths;


    try {

        const level =
            getCurrentMamaLevel();


        message +=

            "\n\n🎯 NIVEAU PÉDAGOGIQUE\n\n" +

            "Niveau actuel : " +
            level +
            " / 100";


        if (
            typeof getLearningPlan ===
            "function"
        ) {

            const plan =
                getLearningPlan();

            if (
                plan &&
                plan.level
            ) {

                message +=

                    "\n\n📚 Prochain parcours : niveau " +
                    plan.level;

            }

        }

    } catch (error) {

        console.error(
            "Erreur affichage progression :",
            error
        );

    }


    document.getElementById(
        "box"
    ).innerText =
        message;


    if (
        typeof getStudentMemory ===
        "function"
    ) {

        const memory =
            getStudentMemory();


        speak(

            "Voici ta progression. " +

            "Tu as " +

            memory.correct +

            " bonnes réponses. " +

            "Continue tes efforts !"

        );

    }


    updateLevelDisplay();
}


// =====================================================
// 📚 MES ERREURS
// =====================================================

function showMistakes() {

    hideMathMenu();


    if (
        typeof getStudentMemory !==
        "function"
    ) {

        return;
    }


    const memory =
        getStudentMemory();


    const mistakes =
        memory.mistakes || [];


    if (
        mistakes.length === 0
    ) {

        const message =

            "📚 MES ERREURS\n\n" +

            "🎉 Aucune erreur enregistrée !\n\n" +

            "Continue comme ça Mama Binta ! 💪🏾";


        document.getElementById(
            "box"
        ).innerText =
            message;


        speak(
            "Aucune erreur enregistrée. " +
            "Continue comme ça Mama Binta !"
        );

        return;
    }


    let message =

        "📚 MES ERREURS\n\n" +

        "Voici les erreurs que nous allons " +
        "revoir ensemble :\n\n";


    mistakes.slice(
        -10
    ).reverse().forEach(
        function(
            mistake,
            index
        ) {

            message +=

                "❌ Erreur " +
                (index + 1) +
                "\n" +

                "Compétence : " +
                (
                    mistake.skill ||
                    mistake.subject ||
                    "—"
                ) +
                "\n" +

                "Question : " +
                (
                    mistake.question ||
                    "—"
                ) +
                "\n" +

                "Ta réponse : " +
                (
                    mistake.studentAnswer ||
                    "—"
                ) +
                "\n" +

                "Bonne réponse : " +
                (
                    mistake.correctAnswer ||
                    "—"
                ) +
                "\n\n";
        }
    );


    message +=

        "💡 Les erreurs sont des occasions " +
        "d'apprendre !";


    document.getElementById(
        "box"
    ).innerText =
        message;


    speak(
        "Voici tes erreurs. " +
        "Nous allons les revoir ensemble. " +
        "Les erreurs sont des occasions d'apprendre."
    );
}


// =====================================================
// 🔎 ANALYSE
// =====================================================

function showAnalysis() {

    hideMathMenu();


    if (
        typeof analyzeStudent !==
        "function"
    ) {

        document.getElementById(
            "box"
        ).innerText =
            "L'analyse n'est pas encore disponible.";

        return;
    }


    const analysis =
        analyzeStudent();


    let message =

        "🔎 ANALYSE DE MAMA BINTA\n\n";


    if (
        analysis.message
    ) {

        message +=
            analysis.message;

    } else {

        message +=
            "L'analyste observe encore les résultats de Mama Binta.";

    }


    document.getElementById(
        "box"
    ).innerText =
        message;


    speak(
        message
    );


    updateLevelDisplay();
}


// =====================================================
// 🔄 RECOMMENCER À ZÉRO
// =====================================================

function resetMamaBinta() {

    const confirmed =
        window.confirm(
            "Voulez-vous vraiment recommencer la progression de Mama Binta à zéro ?"
        );


    if (!confirmed) {
        return;
    }


    try {

        if (
            typeof resetStudentMemory ===
            "function"
        ) {

            resetStudentMemory();
        }


        if (
            typeof resetLearningPlan ===
            "function"
        ) {

            resetLearningPlan();

        } else if (
            typeof resetMathPlan ===
            "function"
        ) {

            resetMathPlan();

        }

    } catch (error) {

        console.error(
            "Erreur lors de la réinitialisation :",
            error
        );

    }


    current = null;

    adaptiveExercises = [];

    adaptiveIndex = 0;

    adaptiveLevel = 1;

    adaptiveSessionStarted =
        false;

    adaptiveSessionFinished =
        false;

    currentMode =
        "none";


    hideMathMenu();

    updateSessionDisplay();

    updateLevelDisplay();


    document.getElementById(
        "box"
    ).innerText =

        "🔄 La progression de Mama Binta " +
        "a été remise à zéro.\n\n" +

        "Nous recommençons au niveau 1. 🌱";


    speak(
        "La progression de Mama Binta a été remise à zéro. " +
        "Nous recommençons au niveau un."
    );
}

// 🚀 INITIALISATION
// =====================================================

updateLevelDisplay();

updateSessionDisplay();


console.log(
    "🏫 Interface de Mama Binta chargée."
);

console.log(
    "🎯 Niveau actuel :",
    getCurrentMamaLevel()
);

console.log(
    "🤖 Parcours personnalisé : 5 exercices par session"
);

console.log(
    "📈 Progression pédagogique : niveaux 1 → 100"
);

console.log(
    "📡 Bus de communication des agents : chargé"
);

</script>
