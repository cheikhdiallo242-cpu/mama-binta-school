<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>École de Mama Binta</title>

<link rel="manifest" href="/static/manifest.json">

<script src="/static/generator.js"></script>
<script src="/static/verifier.js"></script>
<script src="/static/teacher.js"></script>
<script src="/static/memory.js"></script>
<script src="/static/analyzer.js"></script>

<script>

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/sw.js");
}

</script>

<style>

body {
    font-family: Arial;
    background: #fef6e4;
    text-align: center;
    padding: 30px;
}

h1 {
    color: #f582ae;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 6px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #8bd3dd;
}

.choice {
    background: #ffd803;
}

.progress {
    background: #c3f0ca;
}

.mistakes {
    background: #ffb6b6;
}

.analysis {
    background: #cdb4db;
}

.adaptive {
    background: #a7d8ff;
}

.reset {
    background: #ff8a8a;
}

#box {
    margin-top: 20px;
    font-size: 20px;
    white-space: pre-line;
}

#teacher {
    background: #fde68a;
    padding: 15px;
    border-radius: 15px;
}

</style>

</head>


<body>

<h1>École de Mama Binta 👧📚</h1>

<div id="teacher">
👩🏾‍🏫 La maîtresse intelligente est avec toi
</div>

<br>


<button onclick="startReading()">
📖 Lecture
</button>

<button onclick="startMaths()">
➕ Maths
</button>

<br>


<button class="adaptive" onclick="startAdaptive()">
🤖 Exercice personnalisé
</button>

<br>


<button class="progress" onclick="showProgress()">
🧠 Ma progression
</button>

<button class="mistakes" onclick="showMistakes()">
📚 Mes erreurs
</button>

<br>


<button class="analysis" onclick="showAnalysis()">
🔎 Analyse de mes difficultés
</button>

<br>


<button class="reset" onclick="resetStudentMemory()">
🔄 Recommencer à zéro
</button>


<div id="box"></div>


<script>

let current = null;


/* =====================================================
   VOIX
===================================================== */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const u =
        new SpeechSynthesisUtterance(text);

    u.lang = "fr-FR";
    u.rate = 0.85;
    u.pitch = 1.2;

    speechSynthesis.speak(u);
}


/* =====================================================
   QUESTION VÉRIFIÉE
===================================================== */

function getVerifiedQuestion(generator) {

    try {

        let attempts = 0;

        while (attempts < 10) {

            const question =
                generator();

            const verification =
                verifyQuestion(question);

            if (verification.valid) {

                current = question;

                showQuestion();

                return;
            }

            attempts++;
        }


        document.getElementById("box").innerText =
            "⚠️ La maîtresse prépare une nouvelle question.";

        speak(
            "La maîtresse prépare une nouvelle question."
        );

    } catch (error) {

        console.error(
            "Erreur entre les agents :",
            error
        );

        document.getElementById("box").innerText =
            "⚠️ Petit problème technique.\n\n" +
            "La maîtresse prépare une nouvelle question. 😊";

        speak(
            "Petit problème technique. " +
            "La maîtresse prépare une nouvelle question."
        );
    }
}


/* =====================================================
   LECTURE
===================================================== */

function startReading() {

    getVerifiedQuestion(
        generateReadingQuestion
    );
}


/* =====================================================
   MATHS
===================================================== */

function startMaths() {

    getVerifiedQuestion(
        generateMathQuestion
    );
}


/* =====================================================
   🤖 EXERCICE PERSONNALISÉ
===================================================== */

function startAdaptive() {

    getVerifiedQuestion(
        generateAdaptiveQuestion
    );
}


/* =====================================================
   AFFICHAGE
===================================================== */

function showQuestion() {

    let html =
        current.question +
        "\n\n";


    current.choices.forEach(
        function(c) {

            html +=
                '<button class="choice" ' +
                'onclick="checkAnswer(\'' +
                c +
                '\')">' +
                c +
                '</button><br>';

        }
    );


    document.getElementById("box").innerHTML =
        html;


    speak(
        current.question
    );
}


/* =====================================================
   RÉPONSE
===================================================== */

function checkAnswer(choice) {

    const result =
        teacherExplain(
            current,
            choice
        );


    rememberAnswer(
        current,
        choice
    );


    document.getElementById("box").innerText =
        result.message;


    speak(
        result.speech
    );
}


/* =====================================================
   PROGRESSION
===================================================== */

function showProgress() {

    const report =
        getMemoryReport();


    const message =
        "🧠 PROGRESSION DE MAMA BINTA\n\n" +
        report.general +
        "\n\n" +
        report.reading +
        "\n\n" +
        report.maths +
        "\n\n" +
        "Continue tes efforts ! 💪🏾📚";


    document.getElementById("box").innerText =
        message;


    speak(
        "Voici ta progression. " +
        "Tu as " +
        getStudentMemory().correct +
        " bonnes réponses. " +
        "Continue tes efforts !"
    );
}


/* =====================================================
   MES ERREURS
===================================================== */

function showMistakes() {

    const mistakes =
        getMistakes();


    if (mistakes.length === 0) {

        const message =
            "📚 MES ERREURS\n\n" +
            "🎉 Aucune erreur enregistrée !\n\n" +
            "Continue comme ça Mama Binta ! 💪🏾";


        document.getElementById("box").innerText =
            message;


        speak(
            "Aucune erreur enregistrée. " +
            "Continue comme ça Mama Binta !"
        );

        return;
    }


    let message =
        "📚 MES ERREURS\n\n" +
        "Voici les erreurs que nous allons revoir ensemble :\n\n";


    mistakes.forEach(
        function(mistake, index) {

            message +=
                "❌ Erreur " +
                (index + 1) +
                "\n" +
                "Matière : " +
                mistake.subject +
                "\n" +
                "Question : " +
                mistake.question +
                "\n" +
                "Ta réponse : " +
                mistake.studentAnswer +
                "\n" +
                "Bonne réponse : " +
                mistake.correctAnswer +
                "\n\n";

        }
    );


    message +=
        "💡 Les erreurs sont des occasions d'apprendre !";


    document.getElementById("box").innerText =
        message;


    speak(
        "Voici tes erreurs. " +
        "Nous allons les revoir ensemble. " +
        "Les erreurs sont des occasions d'apprendre."
    );
}


/* =====================================================
   ANALYSE
===================================================== */

function showAnalysis() {

    const analysis =
        analyzeStudent();


    const message =
        "🔎 ANALYSE DE MAMA BINTA\n\n" +
        analysis.message;


    document.getElementById("box").innerText =
        message;


    speak(
        analysis.message
    );
}

</script>

</body>

</html>
